services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: riqs-membership-api:local
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "${API_PORT:-5000}:5000"
    # Lets the container reach the host machine's 127.0.0.1-bound services (MinIO on :9000,
    # Postgres on :5432 — see storage/ and database/, both separate Compose projects on this
    # same server) via the hostname `host.docker.internal`, without giving up this
    # container's own network namespace isolation (unlike `network_mode: host`).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
